<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ff">
<meta name="description" content="紫微斗数排盘与命盘解读，输入生辰即出命盘">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="紫微斗数">
<title>紫微斗数 · 排盘</title>
<style>
:root{
  --ink:#2a2440; --ink2:#6b6285; --ink3:#9d96b0;
  --gold:#a8842f; --gold2:#c9a959; --purple:#6d5ba8;
  --glass:rgba(255,255,255,.56);
  --glass2:rgba(255,255,255,.38);
  --brd:rgba(255,255,255,.75);
  --brd2:rgba(120,100,170,.14);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  min-height:100vh;
  background:
    radial-gradient(1100px 620px at 8% -8%, #e6ddff 0%, transparent 58%),
    radial-gradient(900px 520px at 102% 2%, #fdf0d2 0%, transparent 55%),
    radial-gradient(1000px 700px at 48% 112%, #dcecff 0%, transparent 58%),
    linear-gradient(165deg,#fbfaff 0%,#f6f3ff 100%);
  background-attachment:fixed;
  padding:22px 16px 48px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1000px;margin:0 auto}

/* ---------- 顶部 ---------- */
.hero{text-align:center;margin:6px 0 22px}
.hero h1{
  font-size:30px;letter-spacing:.34em;margin:0 0 8px;font-weight:600;
  background:linear-gradient(100deg,#4a3d7a,#a8842f 55%,#6d5ba8);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{margin:0;font-size:13px;color:var(--ink3);letter-spacing:.14em}

/* ---------- 毛玻璃 ---------- */
.glass{
  background:var(--glass);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--brd);
  border-radius:var(--r);
  box-shadow:0 8px 30px rgba(92,72,150,.09), inset 0 1px 0 rgba(255,255,255,.7);
}

/* ---------- 表单 ---------- */
.form{padding:18px;margin-bottom:18px}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:rgba(120,100,170,.09);margin-bottom:16px}
.seg button{
  border:0;background:transparent;padding:7px 20px;border-radius:9px;
  font-size:13.5px;color:var(--ink2);cursor:pointer;font-family:inherit;transition:.18s;
}
.seg button.on{background:#fff;color:var(--purple);font-weight:600;box-shadow:0 2px 8px rgba(92,72,150,.13)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.fields label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink2);letter-spacing:.04em}
.fields input[type=date],.fields select{
  font-family:inherit;font-size:14.5px;color:var(--ink);
  padding:10px 11px;border-radius:11px;
  border:1px solid rgba(120,100,170,.18);
  background:rgba(255,255,255,.72);
  outline:none;transition:.18s;width:100%;
}
.fields input:focus,.fields select:focus{border-color:rgba(109,91,168,.55);box-shadow:0 0 0 3px rgba(109,91,168,.11)}
.leap-row{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);margin-bottom:14px}
.leap-row input{width:15px;height:15px;accent-color:var(--purple)}
.hint{
  display:none;margin:0 0 14px;padding:9px 12px;border-radius:10px;
  font-size:12px;line-height:1.75;color:#8a6a1f;
  background:rgba(200,170,90,.13);border:1px solid rgba(200,170,90,.28);
}
.hint.on{display:block}
.go{
  width:100%;padding:13px;border:0;border-radius:12px;cursor:pointer;
  font-family:inherit;font-size:15px;font-weight:600;letter-spacing:.24em;color:#fff;
  background:linear-gradient(100deg,#6d5ba8,#8a76c9 50%,#a8842f);
  box-shadow:0 6px 20px rgba(109,91,168,.3);
  transition:.2s;
}
.go:hover{transform:translateY(-1px);box-shadow:0 9px 26px rgba(109,91,168,.38)}
.go:active{transform:translateY(0)}
.err{color:#c0392b;font-size:13px;margin:10px 0 0;text-align:center}

/* ---------- 命盘 ---------- */
#result{display:none}
#result.on{display:block;animation:up .5s ease both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.chart{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  grid-template-rows:repeat(4,minmax(112px,1fr));
  gap:7px;
  padding:12px;
  margin-bottom:16px;
}
.palace{
  position:relative;
  padding:9px 10px 8px;
  border-radius:12px;
  background:rgba(255,255,255,.46);
  border:1px solid rgba(255,255,255,.66);
  display:flex;flex-direction:column;
  overflow:hidden;
  transition:.22s;
}
.palace:hover{background:rgba(255,255,255,.66)}
.palace.ming{border-color:rgba(168,132,47,.5);background:rgba(255,250,235,.62)}
.palace.ming .pname{color:var(--gold);font-weight:700}
.palace.liunian{box-shadow:inset 0 0 0 2px rgba(109,91,168,.62)}
.palace.liunian .p-head{padding-right:38px}
.palace.empty{border-style:dashed;border-color:rgba(120,100,170,.34)}
.ln-tag{
  position:absolute;top:0;right:0;font-size:9px;color:#fff;letter-spacing:.06em;
  background:linear-gradient(120deg,#6d5ba8,#8a76c9);
  padding:2px 6px;border-radius:0 11px 0 10px;
}
.empty-tag{font-size:9.5px;color:#a8842f;background:rgba(200,170,90,.16);padding:1px 5px;border-radius:5px;line-height:1.5}
.p-head{display:flex;align-items:baseline;justify-content:space-between;gap:4px;margin-bottom:5px}
.pname{font-size:12.5px;color:var(--ink2);letter-spacing:.05em}
.pganzhi{font-size:10.5px;color:var(--ink3);letter-spacing:.02em}
.p-stars{display:flex;flex-wrap:wrap;gap:3px 6px;align-content:flex-start;flex:1}
.p-foot{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:10px;color:var(--ink3)}
.p-foot .dec i{font-style:normal;opacity:.72;margin-right:2px}
.body-tag{color:#c0392b;font-size:10px}

.star{font-size:12.5px;line-height:1.35;white-space:nowrap}
.star.major{font-size:13.5px;font-weight:600;color:#3d3266}
.star.minor{font-size:11.5px;color:var(--ink2)}
.star.good{font-size:11.5px;color:#2f7d6a}
.star.bad{font-size:11.5px;color:#b4553f}
.br{font-style:normal;font-size:9.5px;color:var(--ink3);margin-left:1px}
.star.strong{color:#8a5a12}
.star.strong .br{color:#b08030}
.star.weak{color:#a9a3b8;font-weight:400}
.hua{
  display:inline-block;font-size:9px;font-weight:700;line-height:1;
  padding:2px 3px;border-radius:4px;margin-left:2px;vertical-align:1px;color:#fff;
}
.hua-禄{background:#3f9e7c}.hua-权{background:#4a7fc1}.hua-科{background:#b8933f}.hua-忌{background:#c25a4a}

/* 中宫 */
.center{
  grid-area:2/2/4/4;
  border-radius:12px;
  background:rgba(255,255,255,.5);
  border:1px solid rgba(255,255,255,.7);
  padding:12px 14px;
  display:flex;flex-direction:column;justify-content:center;gap:7px;
  text-align:center;
}
.c-title{font-size:15px;font-weight:600;color:var(--purple);letter-spacing:.2em}
.c-sub{font-size:11.5px;color:var(--ink3);line-height:1.7}
.c-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;font-size:11.5px;text-align:left;margin-top:2px}
.c-grid div{display:flex;justify-content:space-between;gap:6px;color:var(--ink2)}
.c-grid b{color:var(--ink);font-weight:600}
.c-ln{font-size:11px;color:var(--ink2);margin-top:3px}
.c-hua{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-top:3px}
.c-hua span{font-size:10.5px;padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.8);border:1px solid var(--brd2)}

/* 命盘评价 */
.verdict{padding:24px 22px 20px;margin-bottom:18px;text-align:center;display:none}
.verdict.on{display:block;animation:up .5s ease both}
.vd-label{font-size:11.5px;color:var(--ink3);letter-spacing:.3em;margin-bottom:12px}
.vd-main{font-size:54px;font-weight:700;letter-spacing:.1em;line-height:1.05;margin-bottom:8px}
.vd-main.long{font-size:39px}
.vd-main.t0{color:#b8892f;text-shadow:0 2px 20px rgba(184,137,47,.25)}
.vd-main.t1{color:#6d5ba8;text-shadow:0 2px 20px rgba(109,91,168,.22)}
.vd-main.t2{color:#8b8b9c}
.vd-main.t3{color:#a2856f}
.vd-score{font-size:12.5px;color:var(--ink3);margin-bottom:12px;letter-spacing:.06em}
.vd-score b{font-size:21px;color:var(--ink);font-weight:600;margin-right:1px}
.vd-bar{height:5px;border-radius:3px;background:rgba(120,100,170,.13);overflow:hidden;max-width:320px;margin:0 auto 16px}
.vd-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#8a76c9,#c9a959);transition:width .8s ease}
.vd-why{font-size:13px;line-height:1.95;color:#453d5c;text-align:left;max-width:580px;margin:0 auto 14px}
.vd-line{font-size:12.5px;color:var(--ink2);line-height:1.8;max-width:580px;margin:0 auto 18px;padding-top:12px;border-top:1px dashed rgba(120,100,170,.2)}
.vd-again{
  font-family:inherit;font-size:13.5px;color:var(--purple);cursor:pointer;
  padding:9px 24px;border-radius:11px;border:1px solid rgba(109,91,168,.3);
  background:rgba(255,255,255,.6);transition:.18s;
}
.vd-again:hover{background:#fff;box-shadow:0 4px 14px rgba(109,91,168,.16)}

/* 解读 */
.readings{display:grid;gap:11px;margin-bottom:16px}
.rd{padding:16px 18px}
.rd-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.rd-title{font-size:14px;font-weight:600;color:var(--purple);letter-spacing:.1em}
.rd-badge{
  font-size:11px;padding:2.5px 9px;border-radius:7px;
  background:rgba(168,132,47,.15);color:#8a6a1f;letter-spacing:.03em;
}
.rd-badge.p{background:rgba(109,91,168,.14);color:#5c4d94}
.rd-body{font-size:13.5px;line-height:1.9;color:#453d5c}
.rd-body b{color:#3d3266;font-weight:600}
.rd-body em{font-style:normal;color:#8a6a1f;font-weight:600}
.rd-body .warn{color:#b4553f}
.rd-body .good{color:#2f7d6a}
.rd-note{
  font-size:12px;line-height:1.7;color:var(--ink3);
  margin-top:9px;padding-top:9px;border-top:1px dashed rgba(120,100,170,.2);
}
.rd-disc{font-size:11.5px;color:var(--ink3);text-align:center;line-height:1.7;padding:0 6px}

/* 四化条目 */
.hua-sec{
  font-size:12.5px;font-weight:600;color:var(--purple);letter-spacing:.08em;
  margin:15px 0 11px;padding-bottom:7px;border-bottom:1px solid rgba(120,100,170,.16);
}
.hua-sec:first-child{margin-top:0}
.hua-item{margin-bottom:14px;padding-left:11px;border-left:2px solid rgba(168,132,47,.38)}
.hua-item:last-child{margin-bottom:0}
.hua-t{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.hua-t b{font-size:13.5px;color:#3d3266;letter-spacing:.02em}
.hua-t span{font-size:11.5px;color:#8a6a1f;background:rgba(200,170,90,.15);padding:1px 7px;border-radius:6px}
.hua-b{font-size:13px;line-height:1.88;color:#4a4260}

/* 说明条 */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.note{padding:14px 16px}
.note h3{margin:0 0 8px;font-size:13px;color:var(--purple);letter-spacing:.1em;font-weight:600}
.note p{margin:0;font-size:12.5px;line-height:1.75;color:var(--ink2)}
.legend{display:flex;flex-wrap:wrap;gap:9px;font-size:11.5px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}

@media(max-width:640px){
  body{padding:14px 10px 34px}
  .hero h1{font-size:23px;letter-spacing:.26em}
  .vd-main{font-size:42px}
  .vd-main.long{font-size:28px}
  .verdict{padding:20px 16px 18px}
  .chart{gap:5px;padding:8px;grid-template-rows:repeat(4,minmax(96px,1fr))}
  .palace{padding:6px 7px;border-radius:10px}
  .p-stars{gap:2px 4px}
  .p-foot .dec i{display:none}
  .p-foot .cs{display:none}
  .ln-tag{display:none}
  .palace.liunian .p-head{padding-right:0}
  .palace.liunian{box-shadow:inset 0 0 0 3px rgba(109,91,168,.72)}
  .pname{font-size:11px}
  .star.major{font-size:12px}
  .star{font-size:11px}
  .star.minor,.star.good,.star.bad{font-size:10px}
  .center{padding:8px}
  .c-title{font-size:13px}
  .c-grid{font-size:10px;gap:3px 6px}
  .c-sub{font-size:10px}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <h1>紫微斗数</h1>
    <p>输入生辰 · 起一张命盘</p>
  </header>

  <div id="formWrap">
  <form class="glass form" id="form">
    <div class="seg" id="seg">
      <button type="button" class="on" data-cal="solar">公历</button>
      <button type="button" data-cal="lunar">农历</button>
    </div>
    <div class="fields">
      <label>出生日期<input type="date" id="date" required></label>
      <label>出生时辰<select id="hour"></select></label>
      <label>性别<select id="gender"><option>男</option><option>女</option></select></label>
    </div>
    <div class="leap-row" id="leapRow" style="display:none">
      <input type="checkbox" id="leap"><label for="leap" style="cursor:pointer">该月为闰月</label>
    </div>
    <p class="hint" id="hourHint">晚子时（23:00–00:00）按传统惯例归入<b>次日子时</b>排盘。若出生日期临近农历月末或闰月，建议再用次日早子时核对一次。</p>
    <button class="go" type="submit">起 盘</button>
    <p class="err" id="err" style="display:none"></p>
  </form>
  </div>

  <div class="glass verdict" id="verdict"></div>

  <section id="result">
    <div class="glass chart" id="chart"></div>
    <div class="readings" id="readings"></div>
    <div class="notes">
      <div class="glass note">
        <h3>怎么看</h3>
        <p><b>命宫</b>是底色，看先天禀赋；<b>官禄宫</b>看事业路线，<b>财帛宫</b>看财运模式，<b>夫妻宫</b>看感情缘分。紫框是当下流年命宫，虚线框的<b>空宫</b>表示该宫无主星、需借对宫星曜参看。</p>
        <div class="legend">
          <span><i style="background:#3d3266"></i>主星</span>
          <span><i style="background:#2f7d6a"></i>吉星</span>
          <span><i style="background:#b4553f"></i>煞星</span>
          <span><i style="background:#8a5a12"></i>庙旺（有力）</span>
          <span><i style="background:#a9a3b8"></i>落陷（力弱）</span>
        </div>
      </div>
      <div class="glass note">
        <h3>四化</h3>
        <p>禄主财与顺遂，权主权力与掌控，科主名声与文书，忌主阻碍与牵挂。生年四化是底色，流年四化是当年的着力点。</p>
      </div>
    </div>
  </section>

</div>

<script src="iztro.min.js"></script>
<script>
(function(){
  "use strict";

  var TIME_LABELS = [
    "子时 00:00-01:00","丑时 01:00-03:00","寅时 03:00-05:00","卯时 05:00-07:00",
    "辰时 07:00-09:00","巳时 09:00-11:00","午时 11:00-13:00","未时 13:00-15:00",
    "申时 15:00-17:00","酉时 17:00-19:00","戌时 19:00-21:00","亥时 21:00-23:00",
    "子时 23:00-00:00"
  ];
  /* 地支 → CSS Grid 位置（传统命盘布局：寅起左下，顺时针） */
  var GRID = {
    "寅":[4,1],"卯":[3,1],"辰":[2,1],"巳":[1,1],
    "午":[1,2],"未":[1,3],"申":[1,4],"酉":[2,4],
    "戌":[3,4],"亥":[4,4],"子":[4,3],"丑":[4,2]
  };
  var STRONG = ["庙","旺"], WEAK = ["平","不","陷"];
  var CAL = "solar";

  var $ = function(id){ return document.getElementById(id); };

  /* ---- 时辰下拉 ---- */
  var hourSel = $("hour");
  TIME_LABELS.forEach(function(t,i){
    var o = document.createElement("option");
    o.value = i; o.textContent = t;
    if(i === 1) o.selected = true;
    hourSel.appendChild(o);
  });

  /* ---- 历法切换 ---- */
  $("seg").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    CAL = b.dataset.cal;
    [].forEach.call(this.querySelectorAll("button"), function(x){ x.classList.toggle("on", x === b); });
    $("leapRow").style.display = (CAL === "lunar") ? "flex" : "none";
  });

  /* ---- 晚子时提示 ---- */
  hourSel.addEventListener("change", function(){
    $("hourHint").className = (this.value === "12") ? "hint on" : "hint";
  });

  /* ---- 星曜 ---- */
  function starHTML(s){
    var cls = "star ";
    if(s.type === "major") cls += "major";
    else if(s.type === "tough") cls += "bad";
    else if(s.type === "soft" || s.type === "lucun" || s.type === "tianma") cls += "good";
    else cls += "minor";
    if(s.type === "major" && STRONG.indexOf(s.brightness) > -1) cls += " strong";
    if(s.type === "major" && WEAK.indexOf(s.brightness) > -1) cls += " weak";
    var h = '<span class="' + cls + '">' + s.name;
    if(s.brightness) h += '<i class="br">' + s.brightness + '</i>';
    h += "</span>";
    if(s.mutagen) h += '<b class="hua hua-' + s.mutagen + '">' + s.mutagen + "</b>";
    return h;
  }

  /* ===================== 解读文案库 ===================== */
  /* 宫位名：iztro 只有「命宫」自带宫字，其余不带 */
  function palaceLabel(n){ return n === "命宫" ? "命宫" : n + "宫"; }

  var STAR_DB = {
    "紫微": { role:"帝星",
      soul:"自尊心强，不愿居人之下，天生带一股领袖气场——<b>走进房间不用说话，别人就自动给你让座</b>。做什么都希望自己是拿主意的那个。",
      risk:"孤高、好面子，累的时候也硬扛，不太愿意示弱求人。",
      career:"适合带团队或自己当老板，长期听人指挥会很憋屈。",
      wealth:"赚钱格局大，看不上小钱，但容易在琐碎细节上漏财。",
      love:"感情里要的是被尊重，对方压不住你，你就提不起兴趣。" },
    "天机": { role:"谋士星",
      soul:"脑子转得飞快，一件事能推演出三种走向——<b>像个永远在想「下一步怎么办」的军师</b>。擅长分析、策划、找漏洞。",
      risk:"想得多做得少，容易变卦，焦虑是常态。",
      career:"适合策划、咨询、技术这类靠脑子吃饭的活，纯执行的岗位会浪费你。",
      wealth:"靠信息和脑力变现，但决策容易反复，错过窗口期。",
      love:"需要能跟上你思路的人，太闷的对象你会很快无聊。" },
    "太阳": { role:"光明星",
      soul:"热情、大方、有感染力——<b>像永远在发光发热，照亮别人但自己会累</b>。天生愿意为别人扛事。",

    if(has("太阳","巨门")) return { n:"巨日同宫", t:"表达 · 说服", d:"太阳巨门相会，是典型的「靠嘴和观点立身」结构——表达力、说服力、影响力是你的核心资产。" };
    if(has("太阳","天梁")) return { n:"阳梁昌禄", t:"名声 · 庇护", d:"太阳天梁相会，是「有名有荫」的结构——容易获得信任与提携，适合走专业声望路线。" };
    return null;
  }

  function buildReading(a){
    var soulIdx = -1;
    a.palaces.forEach(function(p, i){ if(p.name === "命宫") soulIdx = i; });
    var soul = a.palaces[soulIdx];
    var opp  = a.palaces[(soulIdx + 6) % 12];
    var byName = {};
    a.palaces.forEach(function(p){ byName[p.name] = p; });

    var cards = [];

    /* ---- 1. 命盘底色 ---- */
    var borrowed = soul.majorStars.length === 0;
    var core = borrowed ? opp.majorStars : soul.majorStars;
    var coreNames = core.map(function(s){ return s.name; });

    if(core.length){
      var body = "";
      var pk = coreNames.length >= 2 ? getPair(coreNames[0], coreNames[1]) : null;
      if(pk) body += pk + "<br><br>";
      body += dimText(core, "soul");
      if(borrowed){
        body = "<b>命宫无主星，借对宫" + palaceLabel(opp.name) + "的" + coreNames.join("、") +
               "来看。</b>空宫不是坏事，意味着这个领域更灵活、更受环境塑造，但也更需要你自己主动去定义。<br><br>" + body;
      }
      /* 亮度修正 */
      var weak = core.filter(function(s){ return BRIGHT_WEAK.indexOf(s.brightness) > -1; });
      if(weak.length){
        body += '<br><br><span class="warn">注意：' + weak.map(function(s){ return s.name; }).join("、") +
                "落在陷位，力量打了折——这些特质不是没有，而是需要你主动去激活它。</span>";
      }
      /* 命宫四化 */
      var soulMut = [];
      core.forEach(function(s){ if(s.mutagen) soulMut.push(s.name + "化" + s.mutagen); });
      if(soulMut.length){
        body += '<br><br>命宫带<b>' + soulMut.join("、") + "</b>，这是先天最浓的一笔底色。";
      }

      var gz = detectGeZhi(a, soulIdx);
      var keywords = core.map(function(s){ return STAR_DB[s.name] ? STAR_DB[s.name].role : ""; }).filter(Boolean);
      cards.push({
        title: "命盘底色 · 先天禀赋",
        badge: coreNames.join(" · ") + (borrowed ? "（借宫）" : ""),
        badgeCls: "p",
        body: body,
        note: gz ? ("格局倾向：<b>" + gz.n + "</b>（" + gz.t + "）——" + gz.d) : (keywords.length ? "星性：<b>" + keywords.join(" / ") + "</b>" : "")
      });
    }

    /* ---- 2. 事业 ---- */
    var career = byName["官禄"];
    if(career){
      var cb = "";
      if(career.majorStars.length){
        cb += dimText(career.majorStars, "career");
        var cm = [];
        career.majorStars.forEach(function(s){ if(s.mutagen) cm.push(s.name + "化" + s.mutagen); });
        if(cm.length) cb += '<br><br>官禄宫带<b>' + cm.join("、") + "</b>，事业上的关键变量在这里。";
      } else {
        var co = a.palaces[(a.palaces.indexOf(career) + 6) % 12];
        cb = "<b>官禄宫无主星，借对宫" + palaceLabel(co.name) + "的" +
             (co.majorStars.map(function(s){ return s.name; }).join("、") || "杂曜") + "参看。</b><br><br>" +
             dimText(co.majorStars, "career");
      }
      var bad = career.minorStars.concat(career.adjectiveStars).filter(function(s){ return s.type === "tough"; });
      if(bad.length) cb += '<br><br><span class="warn">见' + bad.map(function(s){ return s.name; }).join("、") + "，事业路上少不了硬仗和反复，好处是抗压能力也被练出来了。</span>";
      cards.push({ title: "事业方向", badge: palaceLabel("官禄") + " · " + (career.majorStars.map(function(s){ return s.name; }).join("") || "空宫"), badgeCls: "", body: cb });
    }

    /* ---- 3. 财运 ---- */
    var wealth = byName["财帛"];
    if(wealth){
      var wb = "";
      if(wealth.majorStars.length){
        wb += dimText(wealth.majorStars, "wealth");
        var wm = [];
        wealth.majorStars.forEach(function(s){ if(s.mutagen) wm.push(s.name + "化" + s.mutagen); });
        if(wm.length) wb += '<br><br>财帛宫带<b>' + wm.join("、") + "</b>。";
      } else {
        var wo = a.palaces[(a.palaces.indexOf(wealth) + 6) % 12];
        wb = "<b>财帛宫无主星，借对宫" + palaceLabel(wo.name) + "的" +
             (wo.majorStars.map(function(s){ return s.name; }).join("、") || "杂曜") + "参看。</b><br><br>" +
             dimText(wo.majorStars, "wealth");
      }
      cards.push({ title: "财运模式", badge: palaceLabel("财帛") + " · " + (wealth.majorStars.map(function(s){ return s.name; }).join("") || "空宫"), badgeCls: "", body: wb });
    }

    /* ---- 4. 感情 ---- */
    var love = byName["夫妻"];
    if(love){
      var lb = "";
      if(love.majorStars.length){
        lb += dimText(love.majorStars, "love");
        var lm = [];
        love.majorStars.forEach(function(s){ if(s.mutagen) lm.push(s.name + "化" + s.mutagen); });
        if(lm.length) lb += '<br><br>夫妻宫带<b>' + lm.join("、") + "</b>，感情里最需要留意的地方。";
      } else {
        var lo = a.palaces[(a.palaces.indexOf(love) + 6) % 12];
        lb = "<b>夫妻宫无主星，借对宫" + palaceLabel(lo.name) + "的" +
             (lo.majorStars.map(function(s){ return s.name; }).join("、") || "杂曜") + "参看。</b><br><br>" +
             dimText(lo.majorStars, "love");
      }
      cards.push({ title: "感情缘分", badge: palaceLabel("夫妻") + " · " + (love.majorStars.map(function(s){ return s.name; }).join("") || "空宫"), badgeCls: "", body: lb });
    }

    /* ---- 5. 四化与着力点 ---- */
    function huaDetail(m){
      var brief = STAR_BRIEF[m.star] || "一颗重要的星";
      var mean  = PALACE_MEAN[m.pal] || "";
      var spec  = (HUA_IN_PALACE[m.hua] && HUA_IN_PALACE[m.hua][m.pal]) || (HUA_NATURE[m.hua] + "。");
      return '<div class="hua-item">' +
        '<div class="hua-t"><b>' + m.star + "化" + m.hua + "</b><span>" + palaceLabel(m.pal) + "</span></div>" +
        '<div class="hua-b">' + m.star + "是" + brief + "，" + palaceLabel(m.pal) + "管" + mean +
        "。化" + m.hua + "意味着" + HUA_NATURE[m.hua] + "——" + spec + "</div></div>";
    }

    /* 生年四化 */
    var mh = [];
    a.palaces.forEach(function(p){
      p.majorStars.concat(p.minorStars).forEach(function(s){
        if(s.mutagen) mh.push({ star: s.name, hua: s.mutagen, pal: p.name });
      });
    });

    /* 流年四化：当年天干带来的额外变量 */
    var lyHua = [];
    var horo2 = null;
    try{ horo2 = a.horoscope(new Date().getFullYear() + "-06-01"); }catch(e){}
    if(horo2 && horo2.yearly && horo2.yearly.mutagen){
      var HN = ["禄","权","科","忌"];
      horo2.yearly.mutagen.forEach(function(sn, i){
        a.palaces.forEach(function(p){
          p.majorStars.concat(p.minorStars).forEach(function(s){
            if(s.name === sn) lyHua.push({ star: sn, hua: HN[i], pal: p.name });
          });
        });
      });
    }

    if(mh.length || lyHua.length){
      var mb = "";
      if(mh.length){
        mb += '<div class="hua-sec">生年四化 · 先天的四个着力点</div>' + mh.map(huaDetail).join("");
      }
      if(lyHua.length){
        mb += '<div class="hua-sec">' + new Date().getFullYear() + " 流年四化 · 今年额外加进来的变量</div>" +
              lyHua.map(huaDetail).join("");
      }
      cards.push({
        title: "四化着力点",
        badge: "生年 " + mh.length + " 条 · 流年 " + lyHua.length + " 条",
        badgeCls: "", body: mb
      });
    }

    return cards;
  }

  function renderReadings(a){

    var cards = buildReading(a);
    var html = cards.map(function(c){

  /* ===================== 命盘评价 ===================== */
  var TIERS = [
    { min: 80, label: "夯爆了",     cls: "t0", line: "先天结构很硬，起手牌就比大多数人好。该抓的机会别犹豫。" },
    { min: 68, label: "人上人",     cls: "t1", line: "底子扎实、主线清晰，属于走得动也走得远的盘。" },
    { min: 52, label: "可以可以",   cls: "t2", line: "中上水准，有亮点也有要补的地方，后天怎么用很关键。" },
    { min: -1, label: "普通",       cls: "t3", line: "先天牌面不算突出，但这不是决定性的——命盘只管一半。" }
  ];

  var KEY_PALACES = ["命宫","财帛","官禄","夫妻"];

  function evaluate(a){
    var soulIdx = -1;
    a.palaces.forEach(function(p, i){ if(p.name === "命宫") soulIdx = i; });
    var soul = a.palaces[soulIdx];
    var opp  = a.palaces[(soulIdx + 6) % 12];
    var core = soul.majorStars.length ? soul.majorStars : opp.majorStars;
    var s4 = [0, 4, 6, 8].map(function(k){ return a.palaces[(soulIdx + k) % 12]; });

    var why = [], score = 0;

    /* 1. 命宫星力 0–30 */
    var p1;
    if(!core.length){
      p1 = 14;
      why.push("命宫无主星，要借对宫的力量——起点不算强，但可塑性强。");
    } else {
      p1 = 18;
      core.forEach(function(s){
        if(STRONG.indexOf(s.brightness) > -1) p1 += 7;
        else if(["得","利"].indexOf(s.brightness) > -1) p1 += 3;
        else if(WEAK.indexOf(s.brightness) > -1) p1 -= 5;
      });
      var bright = core.map(function(s){ return s.name + (s.brightness || ""); }).join("、");
      var hasGood = core.some(function(s){ return STRONG.indexOf(s.brightness) > -1; });
      var hasWeak = core.some(function(s){ return WEAK.indexOf(s.brightness) > -1; });
      if(hasGood) why.push("命宫" + bright + "，星坐庙旺，先天星力足。");
      else if(hasWeak) why.push("命宫" + bright + "，星落陷位，力量要靠后天主动激活。");
      else why.push("命宫" + bright + "，星力中平。");
    }
    p1 = Math.max(0, Math.min(30, p1));
    score += p1;

    /* 2. 吉星助力 0–25 */
    var lucky = [];
    s4.forEach(function(p){
      p.minorStars.concat(p.adjectiveStars).forEach(function(s){
        if((s.type === "soft" || s.type === "lucun" || s.type === "tianma") && lucky.indexOf(s.name) < 0) lucky.push(s.name);
      });
    });
    score += Math.min(24, lucky.length * 4);
    if(lucky.length) why.push("三方四正会" + lucky.join("、") + "，手上有助力可用。");
    else why.push("三方四正吉星不多，多半得靠自己。");

    /* 3. 煞星干扰 0–25 */
    var bad = [];
    s4.forEach(function(p){
      p.minorStars.concat(p.adjectiveStars).forEach(function(s){
        if(s.type === "tough" && bad.indexOf(s.name) < 0) bad.push(s.name);
      });
    });
    score += Math.max(6, 24 - bad.length * 4);
    if(bad.length) why.push("三方见" + bad.join("、") + "，路上有硬仗——抗压能力也是这么练出来的。");
    else why.push("三方不见煞星，路走得顺。");

    /* 4. 四化落点 0–20 */
    var p4 = 12, huaGood = [], huaBad = [];
    a.palaces.forEach(function(p){
      p.majorStars.concat(p.minorStars).forEach(function(s){
        if(!s.mutagen) return;
        var isKey = KEY_PALACES.indexOf(p.name) > -1;
        if(s.mutagen === "忌"){ if(isKey){ p4 -= 4; huaBad.push(s.name + "化忌落" + palaceLabel(p.name)); } }
        else if(isKey){ p4 += 4; huaGood.push(s.name + "化" + s.mutagen); }
      });
    });
    score += Math.max(4, Math.min(22, p4));
    if(huaGood.length) why.push("生年" + huaGood.join("、") + "落在关键宫位，资源往你这边倾斜。");
    if(huaBad.length) why.push(huaBad.join("、") + "，这是先天得花力气处理的课题。");

    score = Math.max(0, Math.min(100, Math.round(score)));
    var tier = TIERS.filter(function(t){ return score >= t.min; })[0];
    return { score: score, tier: tier, why: why.slice(0, 4) };
  }

  function renderVerdict(a){
    var v = evaluate(a);
    var el = $("verdict");

    el.className = "glass verdict on";

      '<div class="vd-label">命 盘 评 价</div>' +
      '<div class="vd-main ' + v.tier.cls + (long ? " long" : "") + '">' + v.tier.label + "</div>" +
      '<div class="vd-score"><b>' + v.score + "</b> / 100</div>" +
      '<div class="vd-bar"><i style="width:' + v.score + '%"></i></div>' +
      '<div class="vd-why">' + v.why.map(function(w){ return "· " + w; }).join("<br>") + "</div>" +
      '<div class="vd-line">' + v.tier.line + "</div>" +
      '<button class="vd-again" id="again" type="button">改一下生辰</button>';

    $("again").addEventListener("click", function(){
      $("formWrap").style.display = "";
      el.className = "glass verdict";
      el.innerHTML = "";
      $("result").classList.remove("on");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }

  /* ---- 起盘 ---- */
  $("form").addEventListener("submit", function(e){
    e.preventDefault();
    var errEl = $("err"); errEl.style.display = "none";
    try{
      var raw = $("date").value;
      if(!raw) throw new Error("请选择出生日期");
      var p = raw.split("-");

      var ti = +hourSel.value, gd = $("gender").value, leap = $("leap").checked;

        var v = $("verdict");
        var target = (v && v.className.indexOf("on") > -1) ? v : $("result");
        target.scrollIntoView({behavior:"smooth", block:"start"});
      }, 80);
    }catch(err){
      errEl.textContent = err.message || String(err);
      errEl.style.display = "block";
    }
  });

            '<div class="c-hua">' + horo.yearly.mutagen.map(function(s, k){
              return "<span>流年" + names[k] + " · " + s + "</span>";
            }).join("") + "</div>";
    }
    c.innerHTML =
      '<div class="c-title">' + a.fiveElementsClass + "</div>" +
      '<div class="c-sub">' + a.solarDate + " · " + a.lunarDate + "<br>" + a.time + " · " + a.gender + "</div>" +
      '<div class="c-grid">' +
        "<div><span>命主</span><b>" + a.soul + "</b></div>" +
        "<div><span>身主</span><b>" + a.body + "</b></div>" +
        "<div><span>生肖</span><b>" + a.zodiac + "</b></div>" +
        "<div><span>星座</span><b>" + a.sign + "</b></div>" +
        "<div><span>命宫</span><b>" + a.earthlyBranchOfSoulPalace + "</b></div>" +
        "<div><span>身宫</span><b>" + a.earthlyBranchOfBodyPalace + "</b></div>" +
